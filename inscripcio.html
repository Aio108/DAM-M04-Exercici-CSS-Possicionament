<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="estils3.css">
</head>
<body id="principal">

    <div class="container">
        <h1>Inscriu-te al nostre curs</h1>

        <div class="grid">
            <div>
                <h2>Formulari</h2>
                <form>
                    <div class="campo">
                        <label for="nom">Nom:</label>
                        <input type="text" id="nom">
                    </div>
                    <div class="campo">
                        <label for="email">Email:</label>
                        <input type="email" id="email">
                    </div>
                    <div class="campo">
                        <label for="missatge">Missatge(escriu el curs al que voldries aplicar):</label>
                        <textarea id="missatge" rows="4"></textarea>
                    </div>
                    <button type="submit">Enviar</button>
                </form>
            </div>

            <div>
                <h2>Informació</h2>
                <p><strong>Adreça:</strong> Carrer Major 123</p>
                <p><strong>Horari:</strong> 9:00 - 18:00</p>
                <p><strong>Telèfon:</strong> 931234567</p>

                <div class="mapa">
                    <iframe 
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2995.390886282928!2d2.0717665!3d41.3516535!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x12a49950b3f1098f%3A0xde298dc27761473c!2sCarrer%20d'Amadeu%20Vives!5e0!3m2!1ses!2ses" 
                        width="100%" 
                        height="150" 
                        style="border:0;" 
                        loading="lazy">
                    </iframe>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
